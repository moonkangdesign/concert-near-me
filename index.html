<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loud Weekend</title>
<meta name="description" content="주말 근처 콘서트를 날짜·장르·가격·거리로 찾고, 좌석과 근처 숙소까지 묶어 예산을 계산해요.">
<meta name="theme-color" content="#EDEDEA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loud Weekend">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone" id="phone">
  <div class="scroll" id="scroll"></div>

  <nav class="nav" aria-label="메인">
    <button data-tab="home" aria-current="page"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg></span><span>홈</span></button>
    <button data-tab="explore"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><span>탐색</span></button>
    <button data-tab="saved"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="badge" id="badge" hidden>0</span></span><span>내 주말</span></button>
    <button data-tab="me"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg></span><span>내 정보</span></button>
  </nav>

  <section class="detail" id="detail" aria-hidden="true"></section>
  <div class="sumbar" id="sumbar">
    <div><div class="lbl">티켓 + 숙소 예상</div><div class="tot" id="sumTot">₩0</div></div>
    <button class="cta" id="addPlan">주말 계획에 담기</button>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-hidden="true" aria-label="필터"></section>
  <section class="slot" id="slot" aria-hidden="true" aria-label="랜덤 공연 뽑기"></section>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="app.js"></script>
</body>
</html>
