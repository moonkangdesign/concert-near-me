# 서비스워커와 매니페스트는 항상 최신 파일을 받도록 캐시하지 않아요.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/dream/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
