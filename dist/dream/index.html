<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loud Weekend Dream</title>
<meta name="description" content="주말 근처 콘서트를 날짜·장르·가격·거리로 찾고, 좌석과 근처 숙소까지 묶어 예산을 계산해요.">
<meta name="theme-color" content="#ECE6FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LW Dream">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone" id="phone">
  <div class="sky" id="sky" aria-hidden="true"></div>
  <div class="scroll" id="scroll"></div>

  <nav class="nav" aria-label="메인">
    <button id="tab-explore" aria-current="page" data-tab="explore">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>탐색
    </button>
    <button id="tab-saved" data-tab="saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>내 주말 <span class="badge" id="badge" hidden>0</span>
    </button>
  </nav>

  <section class="detail" id="detail" aria-hidden="true"></section>
  <div class="sumbar" id="sumbar">
    <div><div class="lbl">티켓 + 숙소 예상</div><div class="tot" id="sumTot">₩0</div></div>
    <button class="cta" id="addPlan">주말 계획에 담기</button>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-hidden="true" aria-label="필터"></section>
  <section class="slot" id="slot" aria-hidden="true" aria-label="랜덤 공연 뽑기"></section>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="app.js"></script>
</body>
</html>
